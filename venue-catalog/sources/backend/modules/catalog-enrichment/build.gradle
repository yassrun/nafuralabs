plugins {
    id 'java-library'
}

dependencies {
    implementation 'ma.nafuralabs:framework:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:job-runner:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:geo:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:llm-provider:0.1.0-SNAPSHOT'
    implementation project(':venue-catalog:catalog-place')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
