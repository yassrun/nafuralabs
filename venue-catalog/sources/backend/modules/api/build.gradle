plugins {
    id 'java-library'
}

dependencies {
    implementation 'ma.nafuralabs:framework:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:job-runner:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:google-places:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:geo:0.1.0-SNAPSHOT'
    implementation project(':venue-catalog:catalog-job')
    implementation project(':venue-catalog:catalog-place')
    implementation project(':venue-catalog:catalog-enrichment')
    implementation project(':venue-catalog:compliance')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
