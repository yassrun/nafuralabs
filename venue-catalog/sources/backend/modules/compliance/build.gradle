plugins {
    id 'java-library'
}

dependencies {
    implementation 'ma.nafuralabs:framework:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:doc-manager:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:google-places:0.1.0-SNAPSHOT'
    implementation project(':venue-catalog:catalog-place')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter'
}
