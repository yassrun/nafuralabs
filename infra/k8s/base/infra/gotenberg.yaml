# Gotenberg — shared document rendering (headless Chromium)
#
# Shared like postgres/redis/minio: every product that prints documents converts HTML through
# it, so the browser preview and the printed PDF come from one engine.
#
# Never exposed through the Ingress: it converts arbitrary HTML on request. Callers reach it at
# http://gotenberg.<infra-ns>.svc:3000, and the backend refuses any document referencing a
# remote URL before sending it (see HtmlOutboundGuard).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8
          args:
            - "gotenberg"
            # Do NOT set --chromium-deny-list=".*": it also matches the file:// URL Gotenberg
            # writes to its own temp directory to render the page, so every conversion answers
            # 403. The shipped default already denies file:// outside that directory.
            - "--chromium-disable-javascript=true"
            - "--api-timeout=30s"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app: gotenberg
