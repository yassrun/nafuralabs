apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-ops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usage-ops-backend
  template:
    metadata:
      labels:
        app: usage-ops-backend
    spec:
      serviceAccountName: usage-ops-backend
      containers:
        - name: usage-ops-backend
          image: usage-ops-backend:staging
          ports:
            - containerPort: 8087
          env:
            - name: POSTGRES_HOST
              value: postgres.nafura-infra.svc
            - name: POSTGRES_DB
              value: nafura_usage_ops
            - name: KEYCLOAK_ISSUER_URI
              value: http://iam.nafura.local/realms/iam-portal
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak.nafura-infra.svc:8080/realms/iam-portal/protocol/openid-connect/certs
            - name: USAGE_OPS_SEKTOR_BASE_URL
              value: http://sektor-btp-backend.sektor-staging.svc:8082
            - name: USAGE_OPS_BI_BASE_URL
              value: http://build-intelligence-backend.build-intelligence-staging.svc:8086
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 45
            periodSeconds: 20
