apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sektor-btp-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # Import magique / BL scan can wait on Gemini up to ~120s.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: api.sektor.nafuralabs.staging
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sektor-btp-backend
                port:
                  number: 8082
    - host: sektor.nafuralabs.staging
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sektor-btp-web
                port:
                  number: 80
