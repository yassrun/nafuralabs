apiVersion: apps/v1
kind: Deployment
metadata:
  name: sektor-btp-backend
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-address: "http://vault.nafura-infra-demo.svc:8200"
        vault.hashicorp.com/agent-inject-secret-app-db: secret/data/nafura/demo/apps/sektor-btp/database
        vault.hashicorp.com/agent-inject-template-app-db: |
          {{- with secret "secret/data/nafura/demo/apps/sektor-btp/database" -}}
          export POSTGRES_DB="{{ .Data.data.name }}"
          export POSTGRES_SCHEMA="{{ .Data.data.schema }}"
          export POSTGRES_USER="{{ .Data.data.user }}"
          export POSTGRES_PASSWORD="{{ .Data.data.pass }}"
          export NAFURA_AI_SQL_READ_ONLY_DATASOURCE_USERNAME="{{ .Data.data.ai_user }}"
          export NAFURA_AI_SQL_READ_ONLY_DATASOURCE_PASSWORD="{{ .Data.data.ai_user_password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-storage: secret/data/nafura/demo/apps/sektor-btp/object-storage
        vault.hashicorp.com/agent-inject-template-app-storage: |
          {{- with secret "secret/data/nafura/demo/apps/sektor-btp/object-storage" -}}
          export DOCUMENTS_MINIO_ENDPOINT="{{ .Data.data.endpoint }}"
          export DOCUMENTS_MINIO_BUCKET="{{ .Data.data.bucket }}"
          export MINIO_ROOT_USER="{{ .Data.data.user }}"
          export MINIO_ROOT_PASSWORD="{{ .Data.data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-email-brevo: secret/data/nafura/demo/platform/integrations/email/brevo
        vault.hashicorp.com/agent-inject-template-app-email-brevo: |
          {{- with secret "secret/data/nafura/demo/platform/integrations/email/brevo" -}}
          export BREVO_API_KEY="{{ .Data.data.api_key }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-ai-gemini: secret/data/nafura/demo/platform/integrations/ai/gemini
        vault.hashicorp.com/agent-inject-template-app-ai-gemini: |
          {{- with secret "secret/data/nafura/demo/platform/integrations/ai/gemini" -}}
          export AI_GEMINI_API_KEY="{{ .Data.data.api_key }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-keycloak: secret/data/nafura/demo/platform/iam/keycloak
        vault.hashicorp.com/agent-inject-template-app-keycloak: |
          {{- with secret "secret/data/nafura/demo/platform/iam/keycloak" -}}
          export KEYCLOAK_ADMIN_USERNAME="{{ .Data.data.admin_username }}"
          export KEYCLOAK_ADMIN_PASSWORD="{{ .Data.data.admin_password }}"
          {{- end }}
