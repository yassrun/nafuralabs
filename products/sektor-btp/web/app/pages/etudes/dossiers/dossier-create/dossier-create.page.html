<nf-page-shell scroll>
  <nf-page-header [config]="headerConfig"></nf-page-header>

  @if (erreur(); as message) {
    <p class="creer__erreur" role="alert">{{ message }}</p>
  }

  <form class="creer__form" (ngSubmit)="creer()">
    <nf-input
      name="objet"
      label="Objet"
      [required]="true"
      placeholder="Construction d'un ensemble résidentiel — lot gros œuvre"
      [ngModel]="objet()"
      (ngModelChange)="objet.set($event)"
    />

    <app-client-partner-select
      controlId="dossier-create-client"
      label="Client *"
      placeholder="Sélectionner un client Partner"
      [required]="true"
      [clientId]="clientId()"
      [clientNom]="clientNom()"
      (selectionChange)="onClientSelection($event)"
    />

    <nf-action-bar align="right">
      <nf-button variant="secondary" (clicked)="annuler()">Annuler</nf-button>
      <nf-button
        variant="primary"
        [loading]="enCours()"
        [disabled]="!objet().trim() || !clientId() || enCours()"
        (clicked)="creer()"
      >
        Créer et commencer
      </nf-button>
    </nf-action-bar>
  </form>
</nf-page-shell>
