<section class="creer">
  <h1 class="creer__titre">Nouveau dossier d'étude</h1>
  <p class="creer__aide">
    Un dossier porte un marché entrant : ses pièces (CPS, bordereau), son chiffrage et son devis.
    L'objet et le client suffisent à démarrer — le reste se renseigne étape par étape.
  </p>

  @if (erreur(); as message) {
    <p class="creer__erreur" role="alert">{{ message }}</p>
  }

  <form class="creer__form" (ngSubmit)="creer()">
    <label class="creer__champ">
      <span class="creer__label">Objet <span aria-hidden="true">*</span></span>
      <input
        name="objet"
        required
        autofocus
        placeholder="Construction d'un ensemble résidentiel — lot gros œuvre"
        [ngModel]="objet()"
        (ngModelChange)="objet.set($event)"
      />
    </label>

    <div class="creer__champ">
      <app-client-partner-select
        controlId="dossier-create-client"
        label="Client *"
        placeholder="Sélectionner un client Partner"
        [required]="true"
        [clientId]="clientId()"
        [clientNom]="clientNom()"
        (selectionChange)="onClientSelection($event)"
      />
    </div>

    <div class="creer__actions">
      <button type="button" class="creer__bouton" (click)="annuler()">Annuler</button>
      <button
        type="submit"
        class="creer__bouton creer__bouton--principal"
        [disabled]="!objet().trim() || !clientId() || enCours()"
      >
        {{ enCours() ? 'Création…' : 'Créer et commencer' }}
      </button>
    </div>
  </form>
</section>
