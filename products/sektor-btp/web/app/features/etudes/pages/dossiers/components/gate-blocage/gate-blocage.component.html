@if (aDesProblemes()) {
  <p
    class="gate-blocage"
    [class.gate-blocage--bloquant]="bloquant()"
    [attr.role]="bloquant() ? 'alert' : 'status'"
  >
    <span class="gate-blocage__icone" aria-hidden="true">{{ bloquant() ? '⚠' : 'ℹ' }}</span>
    <strong class="gate-blocage__count">{{ resumeCount() }}</strong>
    <span class="gate-blocage__msg">{{ resumeMessage() | translate }}</span>
  </p>
}
