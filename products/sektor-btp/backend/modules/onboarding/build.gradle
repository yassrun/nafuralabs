plugins {
    id 'java-library'
}

dependencies {
    implementation project(':platform:core:framework')
    implementation project(':platform:core:authorization')
    implementation project(':platform:core:identity')
    implementation project(':platform:core:tenancy')
    implementation project(':platform:features:administration:iam')
    implementation project(':platform:features:app-settings')
    implementation project(':platform:features:configuration:sysconfig')
    implementation project(':platform:features:collaboration:notification')
    implementation project(':sektor:item')
    implementation project(':sektor:finance')
    implementation project(':sektor:currency')
    implementation project(':sektor:stock')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
