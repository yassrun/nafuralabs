<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Devis</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1a1a1a; margin: 0; }
    .hdr { display: flex; justify-content: space-between; margin-bottom: 18px; border-bottom: 2px solid #222; padding-bottom: 10px; }
    .hdr h1 { font-size: 16pt; margin: 0 0 4px 0; }
    .muted { color: #555; font-size: 9pt; }
    .parties { width: 100%; margin-bottom: 16px; }
    .parties td { vertical-align: top; width: 50%; padding-right: 12px; }
    table.lines { width: 100%; border-collapse: collapse; margin-top: 8px; }
    table.lines th, table.lines td { border: 1px solid #ccc; padding: 5px 6px; }
    table.lines th { background: #f3f3f3; text-align: left; font-size: 9pt; }
    .num { text-align: right; white-space: nowrap; }
    .totaux { margin-top: 14px; width: 280px; margin-left: auto; }
    .totaux td { padding: 3px 6px; }
    .totaux .grand { font-weight: bold; font-size: 11pt; border-top: 1px solid #222; }
    .lettres { margin-top: 12px; font-size: 9pt; }
    .pied { margin-top: 24px; font-size: 8pt; color: #666; }
    /* Keep a line and its price on the same page, and repeat column titles after a break. */
    table.lines thead { display: table-header-group; }
    table.lines tr { break-inside: avoid; }
    .totaux, .lettres { break-inside: avoid; }
  </style>
</head>
<body>
  <div class="hdr">
    <!-- Shared letterhead: edited once in Administration, reflected on every document.
         Do not inline the company block here again. -->
    <div th:utext="${fragments.HEADER_DEFAULT}"></div>
    <div style="text-align:right">
      <h1>Devis <span th:text="${entity.numero}">DEV-001</span></h1>
      <div class="muted">Version <span th:text="${entity.version}">1</span></div>
      <div class="muted">Émis le
        <span th:text="${#temporals.format(entity.dateEmission, 'dd/MM/yyyy')}">—</span>
        · Valable jusqu'au
        <span th:text="${#temporals.format(entity.dateValidite, 'dd/MM/yyyy')}">—</span></div>
    </div>
  </div>

  <table class="parties">
    <tr>
      <td>
        <strong>Client</strong><br/>
        <span th:text="${entity.client.name}">—</span><br/>
        <span class="muted" th:if="${entity.client.contact}" th:text="${entity.client.contact}"></span>
      </td>
      <td>
        <strong>Objet</strong><br/>
        <span th:text="${entity.objet}">—</span><br/>
        <span class="muted" th:if="${entity.ville}">Ville : <span th:text="${entity.ville}"></span></span>
      </td>
    </tr>
  </table>

  <table class="lines">
    <thead>
      <tr>
        <th>Code</th>
        <th>Désignation</th>
        <th class="num">Qté</th>
        <th>Unité</th>
        <th class="num">PU HT</th>
        <th class="num">Total HT</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="l : ${entity.lignes}">
        <td th:text="${l.code}">—</td>
        <td th:text="${l.designation}">—</td>
        <td class="num" th:text="${#numbers.formatDecimal(l.quantite, 1, 'WHITESPACE', 2, 'COMMA')}">—</td>
        <td th:text="${l.unite}">—</td>
        <td class="num" th:text="${#numbers.formatDecimal(l.prixUnitaireHt, 1, 'WHITESPACE', 2, 'COMMA')}">—</td>
        <td class="num" th:text="${#numbers.formatDecimal(l.totalHt, 1, 'WHITESPACE', 2, 'COMMA')}">—</td>
      </tr>
    </tbody>
  </table>

  <table class="totaux">
    <tr>
      <td>Total HT</td>
      <td class="num" th:text="${#numbers.formatDecimal(entity.totalHt, 1, 'WHITESPACE', 2, 'COMMA')} + ' MAD'">0,00 MAD</td>
    </tr>
    <tr>
      <td>TVA (<span th:text="${#numbers.formatDecimal(entity.tvaTaux, 1, 0)}">20</span> %)</td>
      <td class="num" th:text="${#numbers.formatDecimal(entity.totalTva, 1, 'WHITESPACE', 2, 'COMMA')} + ' MAD'">0,00 MAD</td>
    </tr>
    <tr class="grand">
      <td>Total TTC</td>
      <td class="num" th:text="${#numbers.formatDecimal(entity.totalTtc, 1, 'WHITESPACE', 2, 'COMMA')} + ' MAD'">0,00 MAD</td>
    </tr>
  </table>

  <div class="lettres" th:if="${document?.totaux?.enLettres}">
    Arrêté le présent devis à la somme de
    <strong th:text="${document.totaux.enLettres}"></strong>.
  </div>

  <div class="pied" th:if="${entity.conditionsPaiement}">
    <strong>Conditions de paiement :</strong>
    <span th:text="${entity.conditionsPaiement}"></span>
  </div>

  <!-- Shared legal footer (ICE, RC, IF, patente, CNSS). -->
  <div class="pied" th:utext="${fragments.FOOTER_DEFAULT}"></div>
</body>
</html>
