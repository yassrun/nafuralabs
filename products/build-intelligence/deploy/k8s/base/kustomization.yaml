apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: build-intelligence-staging

resources:
  - backend-service-account.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: build-intelligence-backend
    newName: build-intelligence-backend
    newTag: staging
  - name: build-intelligence-web
    newName: build-intelligence-web
    newTag: staging
