apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: build-intelligence
spec:
  ingressClassName: nginx
  rules:
    - host: build-intelligence.nafura.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: build-intelligence-backend
                port:
                  number: 8086
          - path: /
            pathType: Prefix
            backend:
              service:
                name: build-intelligence-web
                port:
                  number: 80
