plugins {
    id 'java-library'
}

dependencies {
    implementation project(':platform:core:framework')
    implementation project(':platform:core:authorization')
    implementation project(':platform:core:job-runner')
    implementation project(':platform:features:ai:llm-provider')
    implementation project(':platform:features:documents:doc-extractor')
    implementation project(':build-intelligence:documents')
    implementation project(':build-intelligence:catalog')
    implementation project(':build-intelligence:retrieval')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
