plugins {
    id 'java-library'
}

dependencies {
    implementation project(':platform:core:framework')
    implementation project(':platform:core:authorization')
    implementation project(':build-intelligence:documents')
    implementation project(':build-intelligence:extraction')
    implementation project(':build-intelligence:catalog')
    implementation project(':build-intelligence:retrieval')
    implementation project(':build-intelligence:generation')
    implementation project(':build-intelligence:integrations-sektor')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
