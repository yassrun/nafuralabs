spring:
  application:
    name: build-intelligence-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:nafura_build_intelligence}
    username: ${POSTGRES_USER:seyrura}
    password: ${POSTGRES_PASSWORD:seyrura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://iam.nafura.local/realms/nafura}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://iam.nafura.local/realms/nafura/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

build-intelligence:
  dev-jwt:
    enabled: true
    secret: ${BUILD_INTELLIGENCE_DEV_JWT_SECRET:build-intelligence-local-jwt-secret-32}
  integrations:
    sektor:
      api-base-url: ${SEKTOR_API_BASE_URL:http://localhost:8082}

nafura:
  tenancy:
    enabled: true
  security:
    enabled: true
    public-endpoints:
      - /actuator/**
    tenant:
      skip-paths:
        - /api/auth/
        - /actuator/
        - /api/v1/platform/usage/
  ai:
    gemini:
      api-key: ${AI_GEMINI_API_KEY:}

app:
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      endpoint: ${DOCUMENTS_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket: ${DOCUMENTS_MINIO_BUCKET:build-intelligence-documents}
      region: us-east-1

documents:
  minio:
    endpoint: ${DOCUMENTS_MINIO_ENDPOINT:http://localhost:9000}
    accessKey: ${MINIO_ROOT_USER:minioadmin}
    secretKey: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${DOCUMENTS_MINIO_BUCKET:build-intelligence-documents}
    secure: false
