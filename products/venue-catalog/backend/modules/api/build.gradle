plugins {
    id 'java-library'
}

dependencies {
    implementation project(':platform:core:framework')
    implementation project(':platform:core:job-runner')
    implementation project(':platform:integrations:google-places')
    implementation project(':platform:features:foundation:geo')
    implementation project(':venue-catalog:catalog-job')
    implementation project(':venue-catalog:catalog-place')
    implementation project(':venue-catalog:catalog-enrichment')
    implementation project(':venue-catalog:compliance')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
