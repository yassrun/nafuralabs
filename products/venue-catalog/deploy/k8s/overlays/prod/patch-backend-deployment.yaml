apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-catalog-backend
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject-address: "http://vault.nafura-infra-prod.svc:8200"
        vault.hashicorp.com/agent-inject-secret-app-db: "secret/data/nafura/prod/apps/venue-catalog/database"
        vault.hashicorp.com/agent-inject-template-app-db: |
          {{- with secret "secret/data/nafura/prod/apps/venue-catalog/database" -}}
          export POSTGRES_DB="{{ .Data.data.name }}"
          export POSTGRES_SCHEMA="{{ .Data.data.schema }}"
          export POSTGRES_USER="{{ .Data.data.user }}"
          export POSTGRES_PASSWORD="{{ .Data.data.pass }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-storage: "secret/data/nafura/prod/apps/venue-catalog/object-storage"
        vault.hashicorp.com/agent-inject-template-app-storage: |
          {{- with secret "secret/data/nafura/prod/apps/venue-catalog/object-storage" -}}
          export DOCUMENTS_MINIO_ENDPOINT="{{ .Data.data.endpoint }}"
          export DOCUMENTS_MINIO_BUCKET="{{ .Data.data.bucket }}"
          export MINIO_ROOT_USER="{{ .Data.data.user }}"
          export MINIO_ROOT_PASSWORD="{{ .Data.data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-integrations: "secret/data/nafura/prod/apps/venue-catalog/integrations"
        vault.hashicorp.com/agent-inject-template-app-integrations: |
          {{- with secret "secret/data/nafura/prod/apps/venue-catalog/integrations" -}}
          export GOOGLE_PLACES_API_KEY="{{ .Data.data.google_places_api_key }}"
          {{- end }}
    spec:
      containers:
        - name: venue-catalog-backend
          imagePullPolicy: Always
          env:
            - name: POSTGRES_HOST
              value: postgres.nafura-infra-prod.svc
            - name: REDIS_HOST
              value: redis.nafura-infra-prod.svc
            - name: KEYCLOAK_ISSUER_URI
              value: https://iam.nafuralabs.com/realms/iam-portal
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak.nafura-infra-prod.svc:8080/realms/iam-portal/protocol/openid-connect/certs
