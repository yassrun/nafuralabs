apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blanner-staging

resources:
  - ../../base
  - patch-namespace.yaml

patches:
  - path: patch-ingress.yaml
  - path: patch-backend-infra.yaml

images:
  - name: blanner-backend
    newName: blanner-backend
    newTag: staging
