apiVersion: apps/v1
kind: Deployment
metadata:
  name: blanner-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blanner-backend
  template:
    metadata:
      labels:
        app: blanner-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "blanner-backend"
        vault.hashicorp.com/agent-inject-secret-app-db: "secret/data/nafura/staging/apps/blanner/database"
        vault.hashicorp.com/agent-inject-template-app-db: |
          {{- with secret "secret/data/nafura/staging/apps/blanner/database" -}}
          export POSTGRES_DB="{{ .Data.data.name }}"
          export POSTGRES_SCHEMA="{{ .Data.data.schema }}"
          export POSTGRES_USER="{{ .Data.data.user }}"
          export POSTGRES_PASSWORD="{{ .Data.data.pass }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-app-integrations: "secret/data/nafura/staging/apps/blanner/integrations"
        vault.hashicorp.com/agent-inject-template-app-integrations: |
          {{- with secret "secret/data/nafura/staging/apps/blanner/integrations" -}}
          export GOOGLE_PLACES_API_KEY="{{ .Data.data.google_places_api_key }}"
          {{- end }}
    spec:
      serviceAccountName: blanner-backend
      containers:
        - name: blanner-backend
          image: blanner-backend:staging
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -a
              . /vault/secrets/app-db
              . /vault/secrets/app-integrations
              set +a
              exec java -jar app.jar
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: postgres.nafura-infra.svc
            - name: POSTGRES_PORT
              value: "5432"
            - name: SERVER_PORT
              value: "8080"
            - name: CORS_ALLOWED_ORIGIN_PATTERNS
              value: "http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,https://*.nafuralabs.staging,https://*.nafuralabs.com"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 20
