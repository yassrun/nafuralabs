databaseChangeLog:
  - changeSet:
      id: create-places-table
      author: blanner
      changes:
        - createTable:
            tableName: places
            schemaName: public
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: lat
                  type: DOUBLE PRECISION
              - column:
                  name: lng
                  type: DOUBLE PRECISION
              - column:
                  name: google_place_id
                  type: VARCHAR(255)
              - column:
                  name: rating
                  type: DOUBLE PRECISION
              - column:
                  name: is_billable
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: business_owner_id
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - createTable:
            tableName: place_optional_tags
            schemaName: public
            columns:
              - column:
                  name: place_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: tag
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: place_optional_tags
            baseColumnNames: place_id
            constraintName: fk_place_optional_tags_place
            referencedTableName: places
            referencedColumnNames: id
            onDelete: CASCADE

