databaseChangeLog:
  - changeSet:
      id: create-categories-table
      author: blanner
      changes:
        - createTable:
            tableName: categories
            schemaName: public
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: location_title
                  type: VARCHAR(255)
              - column:
                  name: default_image
                  type: VARCHAR(255)
              - column:
                  name: google_tags
                  type: JSONB
              - column:
                  name: billability
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: order_index
                  type: INTEGER
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP

