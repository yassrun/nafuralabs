databaseChangeLog:
  - changeSet:
      id: create-participations-table
      author: blanner
      changes:
        - createTable:
            tableName: participations
            schemaName: public
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: blan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: participations
            baseColumnNames: blan_id
            constraintName: fk_participations_blan
            referencedTableName: blans
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: participations
            baseColumnNames: user_id
            constraintName: fk_participations_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

