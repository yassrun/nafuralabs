databaseChangeLog:
  - changeSet:
      id: create-blan-locations-table
      author: blanner
      changes:
        - createTable:
            tableName: blan_locations
            schemaName: public
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mode
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: place_id
                  type: VARCHAR(255)
              - column:
                  name: place_name
                  type: VARCHAR(255)
              - column:
                  name: address
                  type: TEXT
              - column:
                  name: latitude
                  type: DOUBLE PRECISION
              - column:
                  name: longitude
                  type: DOUBLE PRECISION
              - column:
                  name: area_name
                  type: VARCHAR(255)
              - column:
                  name: bbox_northeast_lat
                  type: DOUBLE PRECISION
              - column:
                  name: bbox_northeast_lng
                  type: DOUBLE PRECISION
              - column:
                  name: bbox_southwest_lat
                  type: DOUBLE PRECISION
              - column:
                  name: bbox_southwest_lng
                  type: DOUBLE PRECISION
              - column:
                  name: area_label
                  type: VARCHAR(255)
              - column:
                  name: area_lat
                  type: DOUBLE PRECISION
              - column:
                  name: area_lng
                  type: DOUBLE PRECISION
              - column:
                  name: map_radius_m
                  type: INTEGER
              - column:
                  name: place_type_id
                  type: UUID
              - column:
                  name: location_text
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: blan_locations
            baseColumnNames: place_type_id
            constraintName: fk_blan_locations_place_type
            referencedTableName: place_types
            referencedColumnNames: id
        # Note: place_id in Location entity references places table, but we need to add it as a separate column
        # For now, we'll add a migration later if Location entity is used
        # The current place_id VARCHAR column is for Google Place ID (BlanLocation entity)

