databaseChangeLog:
  - changeSet:
      id: create-blan-times-table
      author: blanner
      changes:
        - createTable:
            tableName: blan_times
            schemaName: public
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date
                  type: DATE
              - column:
                  name: time
                  type: TIME
              - column:
                  name: time_phrase
                  type: VARCHAR(255)
              - column:
                  name: start_datetime
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP

