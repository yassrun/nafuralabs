databaseChangeLog:
  - changeSet:
      id: create-comments-table
      author: blanner
      changes:
        - createTable:
            tableName: comments
            schemaName: public
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: blan_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: user_id
            constraintName: fk_comments_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: blan_id
            constraintName: fk_comments_blan
            referencedTableName: blans
            referencedColumnNames: id
            onDelete: CASCADE

