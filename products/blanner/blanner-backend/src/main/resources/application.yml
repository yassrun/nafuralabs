# Database Configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/blanner_db
    username: blanner_user
    password: blanner_password
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Use Liquibase for schema management
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
    enabled: true

  # JSON Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.blanner: INFO
    com.blanner.service: INFO
    com.blanner.client: INFO
    com.blanner.controller: INFO
    org.springframework.web: DEBUG
    org.hibernate: WARN

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
  show-actuator: true

# Google Places API Configuration
google:
  places:
    apiKey: ${GOOGLE_PLACES_API_KEY:}
