// Applied by a product's settings: the project is named after app.nafura.json, every bcs/<name>/backend becomes ':bc-<name>'.
def productRoot = new File(settingsDir, '../..').canonicalFile
def app = new groovy.json.JsonSlurper().parse(new File(productRoot, 'app.nafura.json'))
rootProject.name = "${app.metadata.id - 'app.'}-backend"

def bcs = new File(productRoot, 'bcs')
if (bcs.isDirectory()) {
    bcs.eachDir { bc ->
        def backend = new File(bc, 'backend')
        if (new File(backend, 'build.gradle').isFile()) {
            include(":bc-${bc.name}")
            project(":bc-${bc.name}").projectDir = backend
        }
    }
}
