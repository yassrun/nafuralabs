apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: backend
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: cluster
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: app-db, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-db, key: password } }
            # KEYCLOAK_ISSUER_URI, KEYCLOAK_JWK_SET_URI, NAFURA_OWNERS: rendered per product and environment by run.mjs.
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - port: 8080
      targetPort: 8080
