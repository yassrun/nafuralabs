apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-nafura
spec:
  template:
    spec:
      containers:
        - name: minio-mc
          # Même retrait Docker Hub que `minio/minio` — client `mc` servi par quay.io.
          image: quay.io/minio/mc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              mc mb myminio/documents --ignore-existing
              mc anonymous set none myminio/documents
              echo "Nafura buckets initialized"
      restartPolicy: OnFailure
  backoffLimit: 4
