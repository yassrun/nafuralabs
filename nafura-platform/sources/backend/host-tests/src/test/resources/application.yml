spring:
  application:
    name: platform-host-tests
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    check-template-location: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

nafura:
  application:
    id: platform-host-tests
  lab:
    enabled: true
    embedded-postgres: true
    users:
      - { email: admin@host.local, given-name: Host, family-name: Admin, role: SUPER_ADMIN }
      - { email: lead@host.local, given-name: Probe, family-name: Lead, role: PROBE_LEAD }
      - { email: viewer@host.local, given-name: Probe, family-name: Viewer, role: PROBE_VIEWER }
      - { email: outsider@host.local, given-name: No, family-name: Role, role: READER }
      - { email: assignee@host.local, given-name: Role, family-name: Assignee, role: READER }
  security:
    enabled: true
    jwt:
      hs256-secret: platform-host-tests-jwt-secret-32-chars!!
    public-endpoints:
      - /actuator/**
      - /api/public/**
    tenant:
      mode: single
      enabled: true
      validate-tenant: false
      validate-membership: false
      skip-paths:
        - /api/auth/
        - /api/public/
        - /actuator/
