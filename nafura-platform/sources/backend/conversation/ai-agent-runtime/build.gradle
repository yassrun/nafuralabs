plugins {
    id 'java-library'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation project(':platform:core:framework')
    implementation project(':platform:features:ai:llm-provider')
    implementation project(':platform:conversation:ai-agent-api')
    implementation project(':platform:conversation:ai-conversation')
    implementation project(':platform:core:authorization')
    implementation project(':platform:approbation')
    implementation project(':platform:features:administration:subscription')
    implementation project(':platform:features:app-settings')
    implementation project(':platform:features:collaboration:audit')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
