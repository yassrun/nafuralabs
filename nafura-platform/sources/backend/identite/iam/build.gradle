plugins {
    id 'java-library'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation project(':platform:core:framework')
    implementation project(':platform:identite:identity')
    implementation project(':platform:core:tenancy')
    implementation project(':platform:core:authorization')
    implementation project(':platform:identite:access')
    implementation project(':platform:features:collaboration:audit')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
