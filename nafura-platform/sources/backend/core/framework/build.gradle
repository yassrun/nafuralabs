plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

def stackVersions = new Properties()
file('../../../../stack.versions.properties').withInputStream { stackVersions.load(it) }

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${stackVersions.getProperty('spring-boot.version')}"
    }
}

dependencies {
    // Spring Data JPA for repository abstractions
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Spring Web for REST abstractions
    api 'org.springframework.boot:spring-boot-starter-web'
    
    // Validation
    api 'org.springframework.boot:spring-boot-starter-validation'

    // Jackson 2 ObjectMapper still injected by platform services (Boot 4 defaults to Jackson 3)
    api 'com.fasterxml.jackson.core:jackson-databind'
    
    // CSV parsing for import/export
    api 'org.apache.commons:commons-csv:1.11.0'
    
    // MapStruct annotations used by EntityMapper
    api 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // Lombok for reducing boilerplate
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Permission annotations (no runtime): admin controllers declare what they require
    implementation project(':platform:core:authorization-api')
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
