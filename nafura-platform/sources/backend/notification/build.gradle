plugins {
    id 'java-library'
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation project(':platform:core:framework')
    implementation project(':platform:core:authorization-api')
    implementation project(':platform:identite:identity')
    implementation project(':platform:impression')
    implementation project(':platform:features:collaboration:audit')
    implementation project(':platform:commentaire')
    implementation project(':platform:approbation')
    // Optional bridge: invitation mails when IAM is embedded (see NotificationInvitationEmailAutoConfiguration).
    compileOnly project(':platform:identite:iam')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Thymeleaf for email template variable substitution (same as Print Templates)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
