<div class="nf-select-wrapper" [class]="class">
  <label *ngIf="label" [for]="id" class="nf-select-label">
    {{ label }}
    <span class="nf-required-indicator" *ngIf="required">*</span>
  </label>

  <div class="nf-select-row">
    <ng-container *ngIf="isCombobox(); else nativeSelect">
      <div class="nf-combobox" [class.nf-combobox--filled]="comboShowsClear()">
        <input
          #comboInput
          [id]="id"
          type="text"
          role="combobox"
          autocomplete="off"
          [attr.aria-expanded]="comboOpen()"
          [attr.aria-controls]="id + '-list'"
          [attr.aria-activedescendant]="comboOpen() && comboHits()[comboActive()] ? id + '-opt-' + comboActive() : null"
          [attr.aria-invalid]="shouldShowError()"
          [attr.aria-required]="required"
          [attr.aria-describedby]="shouldShowError() ? id + '-error' : null"
          [attr.aria-readonly]="comboLocked()"
          class="nf-select-field nf-combobox__input"
          [value]="comboInputValue()"
          [placeholder]="comboPlaceholder()"
          [disabled]="disabled"
          [readonly]="comboLocked()"
          (focus)="onComboFocus()"
          (input)="onComboInput($event)"
          (keydown)="onComboKeydown($event)"
          (blur)="onComboBlur()"
        />
        <button
          *ngIf="comboShowsClear()"
          type="button"
          class="nf-combobox__clear"
          aria-label="Effacer"
          title="Effacer"
          (mousedown)="$event.preventDefault(); clearCombo($event)"
        >
          ×
        </button>
        <ul
          *ngIf="comboOpen()"
          [id]="id + '-list'"
          role="listbox"
          class="nf-combobox__list"
        >
          <li *ngIf="comboEmptyHint()" class="nf-combobox__hint" role="presentation">
            Taper au moins 2 caractères
          </li>
          <li *ngIf="comboError()" class="nf-combobox__hint nf-combobox__hint--error" role="alert">
            {{ comboError() }}
            <button
              type="button"
              class="nf-combobox__retry"
              (mousedown)="$event.preventDefault(); retryComboSearch()"
            >
              Réessayer
            </button>
          </li>
          <li *ngIf="comboNoHits()" class="nf-combobox__hint" role="presentation">
            Aucun résultat
          </li>
          <li
            *ngFor="let opt of comboHits(); let i = index"
            [id]="id + '-opt-' + i"
            role="option"
            class="nf-combobox__opt"
            [class.nf-combobox__opt--active]="i === comboActive()"
            [attr.aria-selected]="i === comboActive()"
            (mousedown)="$event.preventDefault(); pickCombo(opt)"
          >
            {{ opt.label }}
          </li>
        </ul>
      </div>
    </ng-container>

    <ng-template #nativeSelect>
      <select
        [id]="id"
        [value]="value()"
        [disabled]="disabled"
        [required]="required"
        [attr.aria-invalid]="shouldShowError()"
        [attr.aria-required]="required"
        [attr.aria-describedby]="shouldShowError() ? id + '-error' : null"
        class="nf-select-field"
        (change)="onValueChange($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      >
        <option value="" *ngIf="placeholder" [disabled]="!!value()">{{ placeholder }}</option>
        <option
          *ngFor="let option of displayOptions()"
          [value]="option.value"
          [disabled]="option.disabled || false"
          [selected]="option.value === value()"
        >
          {{ option.label }}
        </option>
      </select>
    </ng-template>

    <button
      *ngIf="hasListShortcut()"
      type="button"
      class="nf-select-list"
      [attr.aria-label]="listShortcutLabel()"
      [title]="listShortcutLabel()"
      [disabled]="disabled"
      (click)="openListShortcut($event)"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path
          d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
        />
      </svg>
    </button>
  </div>

  <span
    *ngIf="shouldShowError()"
    [id]="id + '-error'"
    class="nf-select-error"
    role="alert"
  >
    {{ error }}
  </span>
</div>
