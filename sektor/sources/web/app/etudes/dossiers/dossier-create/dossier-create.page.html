<section class="creer">
  <h1 class="creer__titre">Nouvelle étude</h1>
  @if (erreur(); as message) {
    <p class="creer__erreur" role="alert">{{ message }}</p>
    <nf-button variant="secondary" (clicked)="retourListe()">Retour à la liste</nf-button>
  } @else {
    <p class="creer__aide">Ouverture du dossier — le cadrage se fait à l’étape suivante.</p>
  }
</section>
