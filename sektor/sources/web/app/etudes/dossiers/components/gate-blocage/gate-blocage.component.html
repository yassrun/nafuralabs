@if (visible()) {
  <app-etude-banner
    [tone]="bannerTone()"
    [title]="mode() === 'ok' ? undefined : resumeCount()"
    [message]="resumeMessage() | translate"
  >
    @if (mode() === 'soft') {
      @if (hasPosteIncomplet()) {
        <button type="button" class="gate-blocage__link" (click)="onFocusResume()">
          {{ 'etudes.gate.voir_dans_arbre' | translate }}
        </button>
        <button type="button" class="gate-blocage__cta" (click)="onVerifier()">
          {{ 'etudes.gate.verifier' | translate }}
        </button>
      }
    }

    @if (mode() !== 'ok' && aDesProblemes()) {
      <button type="button" class="gate-blocage__more" (click)="openDetails()">
        {{ 'etudes.gate.voir_details' | translate }}
      </button>
    }

    @if (showPasserManuel()) {
      <button type="button" class="gate-blocage__cta" (click)="onPasserManuel()">
        {{ 'etudes.gate.passer_manuel' | translate }}
      </button>
    }
  </app-etude-banner>
}
