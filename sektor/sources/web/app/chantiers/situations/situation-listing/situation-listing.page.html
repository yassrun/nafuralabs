<nf-screen [header]="headerConfig">

  <div class="situations-toolbar">
    <nf-select
      class="chantier-select"
      lookupKey="chantiers"
      placeholder="Tous les chantiers"
      [lookupSearch]="searchChantiers"
      [ngModel]="selectedChantier()"
      (ngModelChange)="onChantierChange($event)">
    </nf-select>
  </div>

  <nf-entity-listing
    #listing
    [config]="config"
    [facade]="facade"
    (action)="onAction($event)">
  </nf-entity-listing>
</nf-screen>
