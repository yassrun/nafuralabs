<nf-screen [header]="headerConfig" [scroll]="true">

  <nf-entity-detail
    #detail
    [config]="config"
    [mode]="mode()"
    [item]="item()"
    [lookups]="lookups()"
    [loading]="isLoading()"
    [saving]="isSaving()"
    (action)="onAction($event)">

    <ng-template nfField="lines" let-control let-form="form">
      <app-inventaire-lines-editor [linesControl]="control" [headerForm]="asHeaderForm(form)" />
    </ng-template>

  </nf-entity-detail>
</nf-screen>
