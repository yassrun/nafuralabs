<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>BDP chiffré</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 8.5pt; color: #1a1a1a; margin: 0; }
    .hdr { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 2px solid #222; padding-bottom: 8px; }
    .hdr h1 { font-size: 14pt; margin: 0 0 4px 0; }
    .muted { color: #555; font-size: 8pt; }
    .parties { width: 100%; margin-bottom: 10px; }
    .parties td { vertical-align: top; width: 50%; padding-right: 12px; }
    table.lines { width: 100%; border-collapse: collapse; margin-top: 6px; }
    table.lines th, table.lines td { border: 1px solid #ccc; padding: 3px 5px; }
    table.lines th { background: #f3f3f3; text-align: left; font-size: 8pt; }
    .num { text-align: right; white-space: nowrap; }
    .lot { font-weight: bold; background: #fafafa; }
    .totaux { margin-top: 12px; width: 320px; margin-left: auto; }
    .totaux td { padding: 3px 6px; }
    .totaux .grand { font-weight: bold; font-size: 10pt; border-top: 1px solid #222; }
    .lettres { margin-top: 10px; font-size: 8.5pt; }
    .pied { margin-top: 18px; font-size: 8pt; color: #666; }
    table.lines thead { display: table-header-group; }
    table.lines tr { break-inside: avoid; }
    .totaux, .lettres { break-inside: avoid; }
  </style>
</head>
<body>
  <div class="hdr">
    <div th:utext="${fragments.HEADER_DEFAULT}"></div>
    <div style="text-align:right">
      <h1>BDP chiffré — <span th:text="${entity.numero}">ETU-001</span></h1>
      <div class="muted">Bordereau des prix — montants HT et TTC</div>
      <div class="muted">Révision <span th:text="${entity.bordereauRevision}">1</span></div>
    </div>
  </div>

  <table class="parties">
    <tr>
      <td>
        <strong>Client</strong><br/>
        <span th:text="${entity.client.name}">—</span>
      </td>
      <td>
        <strong>Objet</strong><br/>
        <span th:text="${entity.objet}">—</span>
      </td>
    </tr>
  </table>

  <table class="lines">
    <thead>
      <tr>
        <th>Code</th>
        <th>Libellé</th>
        <th class="num">Qté</th>
        <th>Unité</th>
        <th class="num">PU HT</th>
        <th class="num">Total HT</th>
        <th class="num">PU TTC</th>
        <th class="num">Total TTC</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="l : ${entity.lignes}" th:classappend="${l.type == 'LOT' or l.type == 'SOUS_LOT'} ? 'lot' : ''">
        <td th:text="${l.code}">—</td>
        <td>
          <span th:text="${l.indent}"></span>
          <span th:text="${l.libelle}">—</span>
        </td>
        <td class="num" th:text="${l.quantite != null ? #numbers.formatDecimal(l.quantite, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
        <td th:text="${l.unite}">—</td>
        <td class="num" th:text="${l.prixUnitaireHt != null ? #numbers.formatDecimal(l.prixUnitaireHt, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
        <td class="num" th:text="${l.totalHt != null ? #numbers.formatDecimal(l.totalHt, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
        <td class="num" th:text="${l.prixUnitaireTtc != null ? #numbers.formatDecimal(l.prixUnitaireTtc, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
        <td class="num" th:text="${l.totalTtc != null ? #numbers.formatDecimal(l.totalTtc, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(entity.lignes)}">
        <td colspan="8" class="muted">Aucune ligne au bordereau.</td>
      </tr>
    </tbody>
  </table>

  <table class="totaux">
    <tr>
      <td>Total HT</td>
      <td class="num" th:text="${#numbers.formatDecimal(entity.totalHt, 1, 'WHITESPACE', 2, 'COMMA')} + ' MAD'">0,00 MAD</td>
    </tr>
    <tr>
      <td>TVA (<span th:text="${entity.tvaTaux != null ? #numbers.formatDecimal(entity.tvaTaux, 1, 0) : '—'}">20</span> %)</td>
      <td class="num" th:text="${#numbers.formatDecimal(entity.totalTva, 1, 'WHITESPACE', 2, 'COMMA')} + ' MAD'">0,00 MAD</td>
    </tr>
    <tr class="grand">
      <td>Total TTC</td>
      <td class="num" th:text="${#numbers.formatDecimal(entity.totalTtc, 1, 'WHITESPACE', 2, 'COMMA')} + ' MAD'">0,00 MAD</td>
    </tr>
  </table>

  <div class="lettres" th:if="${entity.totalTtcEnLettres}">
    Arrêté le présent bordereau à la somme de
    <strong th:text="${entity.totalTtcEnLettres}"></strong>.
  </div>

  <div class="pied" th:utext="${fragments.FOOTER_DEFAULT}"></div>
</body>
</html>
