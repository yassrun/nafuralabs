<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Ressources prévues</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1a1a1a; margin: 0; }
    .hdr { display: flex; justify-content: space-between; margin-bottom: 14px; border-bottom: 2px solid #222; padding-bottom: 8px; }
    .hdr h1 { font-size: 14pt; margin: 0 0 4px 0; }
    .muted { color: #555; font-size: 9pt; }
    .parties { width: 100%; margin-bottom: 12px; }
    .parties td { vertical-align: top; width: 50%; padding-right: 12px; }
    h2 { font-size: 11pt; margin: 16px 0 6px; }
    table.lines { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.lines th, table.lines td { border: 1px solid #ccc; padding: 5px 6px; }
    table.lines th { background: #f3f3f3; text-align: left; font-size: 9pt; }
    .num { text-align: right; white-space: nowrap; }
    .pied { margin-top: 18px; font-size: 8pt; color: #666; }
    table.lines thead { display: table-header-group; }
    table.lines tr { break-inside: avoid; }
  </style>
</head>
<body>
  <div class="hdr">
    <div th:utext="${fragments.HEADER_DEFAULT}"></div>
    <div style="text-align:right">
      <h1>Ressources prévues</h1>
      <div class="muted"><span th:text="${entity.numero}">ETU-001</span></div>
    </div>
  </div>

  <table class="parties">
    <tr>
      <td>
        <strong>Client</strong><br/>
        <span th:text="${entity.client.name}">—</span>
      </td>
      <td>
        <strong>Objet</strong><br/>
        <span th:text="${entity.objet}">—</span>
      </td>
    </tr>
  </table>

  <h2>Ressources humaines</h2>
  <table class="lines">
    <thead>
      <tr>
        <th>Rôle / profil</th>
        <th class="num">Quantité</th>
        <th>Unité</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${entity.humaines}">
        <td th:text="${r.libelle}">—</td>
        <td class="num" th:text="${r.quantite != null ? #numbers.formatDecimal(r.quantite, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
        <td th:text="${r.unite != null ? r.unite : ''}">—</td>
        <td th:text="${r.notes != null ? r.notes : ''}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(entity.humaines)}">
        <td colspan="4" class="muted">Aucun profil prévu.</td>
      </tr>
    </tbody>
  </table>

  <h2>Matériel</h2>
  <table class="lines">
    <thead>
      <tr>
        <th>Désignation</th>
        <th class="num">Quantité</th>
        <th>Unité</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${entity.materiel}">
        <td th:text="${r.libelle}">—</td>
        <td class="num" th:text="${r.quantite != null ? #numbers.formatDecimal(r.quantite, 1, 'WHITESPACE', 2, 'COMMA') : ''}">—</td>
        <td th:text="${r.unite != null ? r.unite : ''}">—</td>
        <td th:text="${r.notes != null ? r.notes : ''}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(entity.materiel)}">
        <td colspan="4" class="muted">Aucun matériel prévu.</td>
      </tr>
    </tbody>
  </table>

  <div class="pied" th:utext="${fragments.FOOTER_DEFAULT}"></div>
</body>
</html>
