<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Planning prévisionnel</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1a1a1a; margin: 0; }
    .hdr { display: flex; justify-content: space-between; margin-bottom: 14px; border-bottom: 2px solid #222; padding-bottom: 8px; }
    .hdr h1 { font-size: 14pt; margin: 0 0 4px 0; }
    .muted { color: #555; font-size: 9pt; }
    .parties { width: 100%; margin-bottom: 12px; }
    .parties td { vertical-align: top; width: 50%; padding-right: 12px; }
    .kpis { width: 100%; margin-bottom: 12px; }
    .kpis td { width: 33%; padding: 8px; border: 1px solid #ddd; background: #fafafa; }
    .kpis .lbl { display: block; font-size: 8pt; color: #666; }
    .kpis .val { font-size: 11pt; font-weight: bold; }
    table.lines { width: 100%; border-collapse: collapse; margin-top: 6px; }
    table.lines th, table.lines td { border: 1px solid #ccc; padding: 5px 6px; }
    table.lines th { background: #f3f3f3; text-align: left; font-size: 9pt; }
    .num { text-align: right; white-space: nowrap; }
    .pied { margin-top: 18px; font-size: 8pt; color: #666; }
    table.lines thead { display: table-header-group; }
    table.lines tr { break-inside: avoid; }
  </style>
</head>
<body>
  <div class="hdr">
    <div th:utext="${fragments.HEADER_DEFAULT}"></div>
    <div style="text-align:right">
      <h1>Planning prévisionnel</h1>
      <div class="muted"><span th:text="${entity.numero}">ETU-001</span></div>
    </div>
  </div>

  <table class="parties">
    <tr>
      <td>
        <strong>Client</strong><br/>
        <span th:text="${entity.client.name}">—</span>
      </td>
      <td>
        <strong>Objet</strong><br/>
        <span th:text="${entity.objet}">—</span>
      </td>
    </tr>
  </table>

  <table class="kpis">
    <tr>
      <td>
        <span class="lbl">Début</span>
        <span class="val" th:text="${entity.dateDebut != null ? #temporals.format(entity.dateDebut, 'dd/MM/yyyy') : '—'}">—</span>
      </td>
      <td>
        <span class="lbl">Fin</span>
        <span class="val" th:text="${entity.dateFin != null ? #temporals.format(entity.dateFin, 'dd/MM/yyyy') : '—'}">—</span>
      </td>
      <td>
        <span class="lbl">Durée (j. calendaires)</span>
        <span class="val" th:text="${entity.dureeJours != null ? entity.dureeJours : '—'}">—</span>
      </td>
    </tr>
  </table>

  <table class="lines">
    <thead>
      <tr>
        <th>#</th>
        <th>Événement</th>
        <th>Lot vendu</th>
        <th>Début</th>
        <th>Fin</th>
        <th class="num">Durée</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="a, iter : ${entity.activites}">
        <td class="num" th:text="${iter.count}">1</td>
        <td th:text="${a.libelle}">—</td>
        <td th:text="${a.lotLibelle != null ? a.lotLibelle : '—'}">—</td>
        <td th:text="${a.dateDebut != null ? #temporals.format(a.dateDebut, 'dd/MM/yyyy') : '—'}">—</td>
        <td th:text="${a.dateFin != null ? #temporals.format(a.dateFin, 'dd/MM/yyyy') : '—'}">—</td>
        <td class="num" th:text="${a.dureeJours != null ? a.dureeJours + ' j' : ''}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(entity.activites)}">
        <td colspan="6" class="muted">Aucune activité prévue.</td>
      </tr>
    </tbody>
  </table>

  <div class="pied" th:utext="${fragments.FOOTER_DEFAULT}"></div>
</body>
</html>
