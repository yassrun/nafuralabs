plugins {
    id 'java-library'
}

dependencies {
    implementation 'ma.nafuralabs:framework:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:authorization:0.1.0-SNAPSHOT'
    // Print templates for client invoices (see ma.nafura.ventes.print).
    implementation 'ma.nafuralabs:doc-manager:0.1.0-SNAPSHOT'
    implementation project(':sektor:chantiers')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
