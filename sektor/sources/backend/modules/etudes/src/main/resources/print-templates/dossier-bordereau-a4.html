<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Bordereau étude</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #1a1a1a; margin: 0; }
    .hdr { margin-bottom: 14px; border-bottom: 2px solid #222; padding-bottom: 8px; }
    .hdr h1 { font-size: 14pt; margin: 0 0 4px 0; }
    .muted { color: #555; font-size: 8pt; }
    table.lines { width: 100%; border-collapse: collapse; }
    table.lines th, table.lines td { border: 1px solid #ccc; padding: 4px 5px; }
    table.lines th { background: #f3f3f3; text-align: left; }
    .num { text-align: right; white-space: nowrap; }
    .lot { font-weight: bold; background: #fafafa; }
    .totaux { margin-top: 12px; text-align: right; }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="muted" th:text="${tenant.name}">Société</div>
    <h1>Bordereau / DPGF — <span th:text="${entity.numero}">ETU-001</span></h1>
    <div class="muted">
      <span th:text="${entity.objet}">Objet</span>
      · Client : <span th:text="${entity.client.name}">—</span>
      · Rév. <span th:text="${entity.bordereauRevision}">1</span>
    </div>
  </div>

  <table class="lines">
    <thead>
      <tr>
        <th>Code</th>
        <th>Libellé</th>
        <th class="num">Qté</th>
        <th>Unité</th>
        <th class="num">PU</th>
        <th class="num">Total</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="l : ${entity.lignes}" th:classappend="${l.type == 'LOT' or l.type == 'SOUS_LOT'} ? 'lot' : ''">
        <td th:text="${l.code}">—</td>
        <td>
          <span th:text="${l.indent}"></span>
          <span th:text="${l.libelle}">—</span>
        </td>
        <td class="num" th:text="${l.quantite}">—</td>
        <td th:text="${l.unite}">—</td>
        <td class="num" th:text="${l.prixUnitaire}">—</td>
        <td class="num" th:text="${l.total}">—</td>
      </tr>
    </tbody>
  </table>

  <div class="totaux">
    <div>Total HT : <strong th:text="${entity.totalHt}">0</strong></div>
    <div th:if="${entity.tvaTaux}">TVA (<span th:text="${entity.tvaTaux}"></span> %) :
      <strong th:text="${entity.totalTva}">0</strong></div>
    <div>Total TTC : <strong th:text="${entity.totalTtc}">0</strong></div>
  </div>
</body>
</html>
