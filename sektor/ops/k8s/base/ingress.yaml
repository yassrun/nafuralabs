apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sektor-btp-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # CPS / bordereau / BL uploads — default nginx limit is 1m.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Import magique / BL scan and the multi-batch CPS descriptif pass can run for
    # several minutes (one Gemini call per poste batch), so allow a long read.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.sektor.nafuralabs.staging
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sektor-btp-backend
                port:
                  number: 8082
    - host: sektor.nafuralabs.staging
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sektor-btp-web
                port:
                  number: 80
