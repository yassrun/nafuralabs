spring:
  application:
    name: sandbox-backend
  datasource:
    url: jdbc:h2:file:./data/sandbox;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    check-template-location: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

nafura:
  application:
    id: sandbox
  security:
    enabled: true
    jwt:
      # Lab HS256 — same secret used by /api/public/sandbox/session issuer
      hs256-secret: sandbox-local-jwt-secret-key-32-chars!!
    public-endpoints:
      - /actuator/**
      - /api/public/**
      - /h2-console/**
    tenant:
      # single → scope module fills TenantContext (no X-Tenant-Id required)
      mode: single
      enabled: true
      validate-tenant: false
      validate-membership: false
      skip-paths:
        - /api/auth/
        - /api/public/
        - /actuator/
        - /h2-console/
