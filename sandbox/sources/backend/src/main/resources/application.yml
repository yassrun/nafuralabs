spring:
  application:
    name: sandbox-backend
  datasource:
    url: jdbc:h2:file:./data/showroom;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
