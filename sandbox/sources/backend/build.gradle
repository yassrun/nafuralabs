import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

def stackVersions = new Properties()
file('../../../nafura-platform/stack.versions.properties').withInputStream { stackVersions.load(it) }

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${stackVersions.getProperty('spring-boot.version')}"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((findProperty('stack.java.version') ?: stackVersions.getProperty('java.version')).toString().toInteger())
    }
}

dependencies {
    // Layer 0 + Layer 1 (connected users)
    implementation 'ma.nafuralabs:framework:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:multi-tenant:0.1.0-SNAPSHOT'
    // Admin / settings lab surface
    implementation 'ma.nafuralabs:user-settings:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:app-settings:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:organization-identity:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:sysconfig:0.1.0-SNAPSHOT'
    implementation 'ma.nafuralabs:impression:0.1.0-SNAPSHOT'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('bootJar') {
    archiveBaseName = 'sandbox-backend'
}
